version: "3.9"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka1:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # listeners: internal + advertised name for other containers
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://host.docker.internal:9092

      # internal topics replicated on 2 brokers
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  kafka2:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka2
    depends_on:
      - zookeeper
    ports:
      - "9093:9092"   # host:container
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://host.docker.internal:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    depends_on:
      - kafka1
      - kafka2
    ports:
      - "9000:9000"
    environment:
      # use internal broker names
      KAFKA_BROKERCONNECT: "kafka1:9092,kafka2:9092"
      SERVER_SERVLET_CONTEXTPATH: "/"

  # --------------------------------------------------------
  # One-shot container to create all topics (RF=2)
  # --------------------------------------------------------
  create-topics:
    image: confluentinc/cp-kafka:7.7.1
    container_name: create-topics
    depends_on:
      - kafka1
      - kafka2
    entrypoint: ["/bin/bash", "-c"]
    command: >
      echo 'Waiting for brokers...';
      sleep 8;
      kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists --topic price.ticker   --partitions 6  --replication-factor 2 --config cleanup.policy=compact &&
      kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists --topic offer.inbound  --partitions 12 --replication-factor 2 &&
      kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists --topic policy.config  --partitions 1  --replication-factor 2 --config cleanup.policy=compact &&
      kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists --topic offer.scored   --partitions 12 --replication-factor 2 &&
      kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists --topic offer.accepted --partitions 12 --replication-factor 2 &&
      kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists --topic offer.rejected --partitions 12 --replication-factor 2 &&
      kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists --topic order.created  --partitions 6  --replication-factor 2;
      echo 'Topics created 🎉';
    restart: "no"

  # --------------------------------------------------------
  # Your Java app image (streams-app module)
  # Reused for price-generator, offers-generator, StreamsApp
  # --------------------------------------------------------

  streams-app:
    build:
      context: ../streams-app
    container_name: streams-app
    depends_on:
      - kafka1
      - kafka2
      - create-topics
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092"
    # ENTRYPOINT in Dockerfile: ["java","-cp","/app/app.jar"]
    # so this "command" is just the main class:
    command: ["app.streams.StreamsApp"]

  price-generator:
    build:
      context: ../streams-app
    container_name: price-generator
    depends_on:
      - kafka1
      - kafka2
      - create-topics
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092"
    command: ["app.pricegenerator.PriceGenerator"]

  offers-generator:
    build:
      context: ../streams-app
    container_name: offers-generator
    depends_on:
      - kafka1
      - kafka2
      - create-topics
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092"
    command: ["app.offergenerator.OffersGenerator"]
  backendsse:
    build:
      context: ../backend-sse
    container_name: backendsse
    depends_on:
      - kafka1
      - kafka2
      - create-topics
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092"
      SERVER_PORT: "8088"
    ports:
      - "8088:8088"

  web-ui:
    build:
      context: ../web
    container_name: web-ui
    depends_on:
      - backendsse
    ports:
      - "3000:80"
