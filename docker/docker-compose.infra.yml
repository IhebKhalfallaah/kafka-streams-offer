version: "3.9"

networks:
  kafka-net:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - kafka-net

  kafka1:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - kafka-net

  kafka2:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka2
    depends_on:
      - zookeeper
    ports:
      - "9093:9092"   # host 9093 -> container 9092
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - kafka-net

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    depends_on:
      - kafka1
      - kafka2
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka1:9092,kafka2:9092"
      SERVER_SERVLET_CONTEXTPATH: "/"
    networks:
      - kafka-net

  create-topics:
    image: confluentinc/cp-kafka:7.7.1
    container_name: create-topics
    depends_on:
      - kafka1
      - kafka2
    networks:
      - kafka-net
    entrypoint: ["/bin/bash", "-c"]
    command: >
      echo 'Waiting for kafka1 to be ready...';
      for i in {1..20}; do
        kafka-topics --bootstrap-server kafka1:9092 --list >/dev/null 2>&1 && break;
        echo "kafka1 not ready yet... attempt $i";
        sleep 3;
      done;
      echo "Creating topics...";

      kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists \
        --topic price.ticker --partitions 6 --replication-factor 2 \
        --config cleanup.policy=compact;

      kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists \
        --topic offer.inbound --partitions 12 --replication-factor 2;

      kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists \
        --topic policy.config --partitions 1 --replication-factor 2 \
        --config cleanup.policy=compact;

      kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists \
        --topic offer.scored --partitions 12 --replication-factor 2;

      kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists \
        --topic offer.accepted --partitions 12 --replication-factor 2;

      kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists \
        --topic offer.rejected --partitions 12 --replication-factor 2;

      kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists \
        --topic order.created --partitions 6 --replication-factor 2;

      echo 'Topics created 🎉';
    restart: "no"
